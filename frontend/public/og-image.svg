<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="0.55" stop-color="#1e3a8a"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1200" height="630" fill="url(#bg)"/>

  <!-- Large bolt watermark -->
  <g opacity="0.10">
    <svg x="720" y="60" width="520" height="520" viewBox="0 0 24 24">
      <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2" fill="#ffffff"/>
    </svg>
  </g>

  <!-- Logo tile -->
  <rect x="90" y="96" width="96" height="96" rx="22" ry="22" fill="url(#tile)"/>
  <svg x="114" y="120" width="48" height="48" viewBox="0 0 24 24">
    <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2" fill="#ffffff" stroke="#ffffff" stroke-width="1.5" stroke-linejoin="round"/>
  </svg>
  <text x="210" y="162" font-family="Arial, Helvetica, sans-serif" font-size="56" font-weight="700" fill="#ffffff">Welkora</text>

  <!-- Headline -->
  <text x="90" y="320" font-family="Arial, Helvetica, sans-serif" font-size="72" font-weight="800" fill="#ffffff">HR-Prozesse</text>
  <text x="90" y="400" font-family="Arial, Helvetica, sans-serif" font-size="72" font-weight="800" fill="#93c5fd">automatisieren</text>

  <!-- Subline -->
  <text x="92" y="462" font-family="Arial, Helvetica, sans-serif" font-size="30" fill="#cbd5e1">Onboarding · Offboarding · Rollenwechsel</text>

  <!-- Feature chips -->
  <g font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#e2e8f0">
    <circle cx="104" cy="540" r="7" fill="#34d399"/>
    <text x="122" y="549">DSGVO-konform</text>
    <circle cx="384" cy="540" r="7" fill="#34d399"/>
    <text x="402" y="549">Audit-Trail</text>
    <circle cx="604" cy="540" r="7" fill="#34d399"/>
    <text x="622" y="549">Task-Management</text>
  </g>

  <!-- Domain -->
  <text x="1110" y="588" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#bfdbfe">welkora.net</text>
</svg>
